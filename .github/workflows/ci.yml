name: CI/CD

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  # ============================================================
  #  CI — 代码质量检查 & 编译
  # ============================================================
  lint:
    name: Lint & Vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"

      - name: go fmt
        run: |
          unformatted=$(go fmt ./...)
          if [ -n "$unformatted" ]; then
            echo "以下文件格式不符合规范："
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go mod tidy check
        run: |
          cp go.sum go.sum.bak
          go mod tidy
          if ! diff -q go.sum go.sum.bak; then
            echo "go.sum 不是最新的，请运行 go mod tidy 后重新提交"
            exit 1
          fi

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"

      - name: Build
        run: go build -o gdf ./cmd/gdf

      - name: Smoke test
        run: |
          # 确保二进制可以输出帮助信息
          ./gdf --help 2>&1 || true
          file ./gdf

  # ============================================================
  #  CD — 打 Tag 后自动构建多平台产物并发布 Release
  # ============================================================
  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: build
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
          - goos: windows
            goarch: arm64
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          ext=""
          if [ "$GOOS" = "windows" ]; then ext=".exe"; fi
          go build -ldflags="-s -w" -o "gdf-${GOOS}-${GOARCH}${ext}" ./cmd/gdf

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: gdf-${{ matrix.goos }}-${{ matrix.goarch }}
          path: gdf-${{ matrix.goos }}-${{ matrix.goarch }}*

  create-release:
    name: Create GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: release
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: artifacts

      - name: Organize artifacts
        run: |
          mkdir dist
          # 把所有产物移到 dist/ 并在 GitHub Release 中展示
          find artifacts -type f | while read f; do
            basename=$(basename "$f")
            cp "$f" "dist/$basename"
            echo "  - $basename"
          done
          echo ""
          echo "产物列表："
          ls -lh dist/

      - name: Generate checksums
        working-directory: dist
        run: sha256sum * > checksums.txt

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
